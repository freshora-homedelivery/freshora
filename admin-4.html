<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex">
<title>Freshora Admin</title>
<style>
:root{--g:#2e7d32;--bg:#f3f6f1;--s:#fff;--ink:#17261b;--m:#5d6b60;--l:#dbe3d6;--r:#d6432a;--c:#e3ecdf}
@media(prefers-color-scheme:dark){:root{--bg:#101a13;--s:#18241b;--ink:#e8f0e6;--m:#93a496;--l:#2a3a2d;--r:#ff7a5f;--c:#22332a;--g:#4caf50;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif;padding-bottom:84px}
.hd{display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top,0)) 16px 12px;background:var(--g);color:#fff;position:sticky;top:0;z-index:5}
.hd button{background:#ffffff33;border:0;color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
main{max-width:720px;margin:0 auto;padding:14px}
.card{background:var(--s);border:1px solid var(--l);border-radius:14px;padding:14px;margin:10px 0}
.rw{display:flex;justify-content:space-between;align-items:center;gap:8px}.mu{color:var(--m);font-size:14px}
.b,.b2{border:0;border-radius:10px;padding:11px 16px;font:700 15px inherit;cursor:pointer;background:var(--g);color:#fff}
.b2{background:var(--c);color:var(--ink);display:inline-block}.b.big{width:100%;font-size:17px;padding:14px;margin:6px 0}.dn{background:var(--r)}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--l);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;margin:4px 0}
label{font-weight:600;font-size:14px;display:block;margin-top:8px}label.b2{margin:4px 0}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:10px}.st{background:var(--s);border:1px solid var(--l);border-radius:14px;padding:14px}.st b{display:block;font-size:26px}
.tb{position:fixed;bottom:0;left:0;right:0;background:var(--s);border-top:1px solid var(--l);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0));z-index:9}
.tb button{flex:1;border:0;background:none;color:var(--m);font-size:12px;font-weight:600;padding:4px;cursor:pointer}.tb button span{display:block;font-size:22px}.tb .on{color:var(--g)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0}.ch{border:0;background:var(--c);color:var(--ink);padding:8px 14px;border-radius:99px;white-space:nowrap;font-weight:600;cursor:pointer}.ch.on{background:var(--g);color:#fff}
.bd{padding:3px 10px;border-radius:99px;font-size:13px;font-weight:700;background:var(--c)}.s0{background:#fff3cd;color:#5c4400}.s3{background:#d4edda;color:#155724}.s4{background:#f8d7da;color:#721c24}
.tid{font-size:18px;letter-spacing:.04em}.it{display:flex;gap:12px;align-items:center}
.th{width:60px;height:60px;border-radius:12px;background:var(--c);display:grid;place-items:center;font-size:30px;overflow:hidden;flex:none}.th img{width:100%;height:100%;object-fit:cover}
.bar2{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:10px 0}.bar2 input{margin:0}
.md{position:fixed;inset:0;background:#0008;z-index:30;display:flex;align-items:flex-end;justify-content:center}.md[hidden]{display:none}
.sheet{background:var(--s);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0))}
.sheet h3,main h3{margin:6px 0}.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.acts .b,.acts .b2{flex:1;min-width:110px}
.pv{height:150px;border-radius:14px;display:grid;place-items:center;color:#fff;background-size:cover;background-position:center;text-align:center;padding:10px;margin:8px 0}
.sw{display:inline-block;width:44px;height:44px;border-radius:50%;border:3px solid transparent;margin:4px;cursor:pointer}.sw.on{border-color:var(--ink)}
.chip2{display:inline-flex;gap:6px;background:var(--c);border-radius:99px;padding:5px 6px 5px 12px;margin:3px}.chip2 button{border:0;background:#0002;border-radius:50%;width:22px;height:22px;cursor:pointer}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#17261b;color:#fff;padding:11px 18px;border-radius:99px;z-index:50;display:none;font-weight:600}
.lg{max-width:380px;margin:12vh auto;padding:20px}.lg h1{color:var(--g);font-size:36px;margin:0 0 4px}.msg{color:var(--r);min-height:22px}
</style></head><body>
<div class="lg" id="login"><h1>Freshora</h1><p class="mu">Admin panel. Sign in to manage your store.</p>
<label for="em">Email</label><input id="em" type="email" autocomplete="username"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
<div class="msg" id="lm"></div><button class="b big" id="lb">Sign in</button></div>
<div id="app" hidden><div class="hd"><b>🥬 Freshora Admin</b><button id="out">Sign out</button></div><main id="main"></main>
<nav class="tb"><button data-t="dash" class="on"><span>📊</span>Home</button><button data-t="orders"><span>📦</span>Orders</button><button data-t="prods"><span>🥬</span>Products</button><button data-t="posters"><span>🖼️</span>Posters</button><button data-t="set"><span>⚙️</span>Settings</button></nav></div>
<div class="md" id="md" hidden data-act="close"><div class="sheet" id="sheet"></div></div><div id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
var $=function(i){return document.getElementById(i)},tab="dash",filter="All",q="",orders=[],items=[],cats=[],banners=[],S={},first=true,ctx=null,started=false,pimg="",editId=null,bimg="",bbg="",bedit=null;
var STAT=["New","Packed","Out for delivery","Delivered","Cancelled"],NEXT={New:"Packed",Packed:"Out for delivery","Out for delivery":"Delivered"};
var GR=["linear-gradient(120deg,#2e7d32,#1b5e20)","linear-gradient(120deg,#f57c00,#bf360c)","linear-gradient(120deg,#d32f2f,#7f0000)","linear-gradient(120deg,#1976d2,#0d47a1)","linear-gradient(120deg,#7b1fa2,#4a148c)"];
var TPL=[["Weekend Offer","Weekend Fresh Offer","Free delivery on all orders","🎉",1],["Fresh Arrivals","Fresh Arrivals Today","Straight from the market","🥬",0],["Festival","Festival Special","Order early, we deliver on time","🪔",2],["Fruit Week","Fruit Week","Sweet and fresh, at your door","🍉",4]];
var COL=["#2e7d32","#e65100","#1565c0","#6a1b9a","#c62828"],UNITS=["kg","g","piece","bunch","dozen","litre","pack"];
var SEED=[["Tomato","🍅",40,"kg","Vegetables"],["Onion","🧅",35,"kg","Vegetables"],["Potato","🥔",30,"kg","Vegetables"],["Coriander","🌿",10,"bunch","Vegetables"],["Banana","🍌",60,"kg","Fruits"],["Papaya","🧡",40,"kg","Fruits"],["Coconut","🥥",30,"piece","Others"]];
function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";setTimeout(function(){t.style.display="none"},2600)}
function beep(){try{var o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=880;g.gain.value=.2;o.start();o.stop(ctx.currentTime+.35);if(navigator.vibrate)navigator.vibrate(300)}catch(e){}}
function shrink(f,max,qq){return new Promise(function(ok,no){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",qq))};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(f)})}
function show(h){$("sheet").innerHTML=h;$("md").hidden=false}function close(){$("md").hidden=true}
function when(o){return o.createdAt?o.createdAt.toDate().toLocaleString([], {day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):""}
function thumb(i){return '<div class="th">'+(i.image?'<img src="'+esc(i.image)+'" alt="">':esc(i.emoji||"🥬"))+'</div>'}
function stat(e,v,l){return '<div class="st">'+e+'<b>'+v+'</b><span class="mu">'+l+'</span></div>'}
function oc(o){var n=NEXT[o.status];return '<div class="card"><div class="rw"><b class="tid">'+esc(o.id)+'</b><span class="bd s'+STAT.indexOf(o.status)+'">'+esc(o.status)+'</span></div><div class="mu">'+esc(when(o))+' · '+esc(o.zone)+' · '+esc(o.payment||"")+(o.paid?' · ✅ paid':'')+'</div>'+
'<p style="margin:8px 0">👤 '+esc(o.name)+' · <a href="tel:'+esc(o.phone)+'">📞 '+esc(o.phone)+'</a><br>📍 '+esc(o.address)+'</p>'+(o.items||[]).map(function(x){return '<div class="rw"><span>'+esc(x.name)+' × '+esc(x.qty)+' '+esc(x.unit)+'</span><span>₹'+esc(x.qty*x.price)+'</span></div>'}).join("")+
'<div class="rw" style="border-top:1px solid var(--l);margin-top:6px;padding-top:6px"><b>Total (delivery ₹'+esc(o.delivery)+')</b><b>₹'+esc(o.total)+'</b></div><div class="acts">'+(n?'<button class="b" data-act="st" data-id="'+esc(o.id)+'" data-v="'+n+'">Mark '+n+'</button>':'')+
(o.status!=="Cancelled"&&o.status!=="Delivered"?'<button class="b2" data-act="st" data-id="'+esc(o.id)+'" data-v="Cancelled">Cancel</button>':'')+'<button class="b2" data-act="paid" data-id="'+esc(o.id)+'" data-v="'+(!o.paid)+'">'+(o.paid?'Unmark paid':'Payment received')+'</button></div></div>'}
function dash(){var td=new Date().toDateString(),t=orders.filter(function(o){return o.createdAt&&o.createdAt.toDate().toDateString()===td}),sales=t.filter(function(o){return o.status!=="Cancelled"}).reduce(function(a,o){return a+(o.total||0)},0),nw=orders.filter(function(o){return o.status==="New"}).length,pr=orders.filter(function(o){return o.status==="Packed"||o.status==="Out for delivery"}).length;
return '<div class="g4">'+stat("🆕",nw,"New orders")+stat("🚚",pr,"In progress")+stat("🧾",t.length,"Orders today")+stat("💰","₹"+sales,"Sales today")+'</div>'+(nw?'<button class="b big" data-act="go" data-v="orders">Open '+nw+' new order'+(nw>1?'s':'')+'</button>':'')+
'<h3>Recent orders</h3>'+(orders.slice(0,5).map(oc).join("")||'<p class="mu">No orders yet. Add products, then share your store link.</p>')+(items.length?'':'<div class="card"><b>Get started</b><p class="mu">Your store has no products yet.</p><button class="b" data-act="seed">Add sample products</button></div>')}
function head(){
 if(tab==="orders")return '<input id="q" placeholder="🔍 Search tracking ID, name or phone" value="'+esc(q)+'"><div class="chips" id="fc"></div><div id="lst"></div>';
 if(tab==="prods")return '<div class="card"><b>Categories</b><div id="cl"></div><div class="bar2"><input id="cn" placeholder="New category name"><input id="ce" placeholder="Emoji" style="max-width:90px"><button class="b" data-act="addcat">Add</button></div></div><div class="bar2"><input id="q" placeholder="🔍 Search products" value="'+esc(q)+'"><button class="b" data-act="newprod">+ Product</button></div><div id="lst"></div>';
 if(tab==="posters")return '<div class="bar2"><b>Posters on your home page</b><button class="b" data-act="newpost">+ New poster</button></div><div id="lst"></div>';
 return '<div id="lst"></div>'}
function lst(){var L=$("lst");if(!L)return;
 if(tab==="dash")L.innerHTML=dash();
 if(tab==="orders"){$("fc").innerHTML=["All"].concat(STAT).map(function(s){var n=s==="All"?orders.length:orders.filter(function(o){return o.status===s}).length;return '<button class="ch'+(s===filter?' on':'')+'" data-act="flt" data-v="'+s+'">'+s+' ('+n+')</button>'}).join("");
  var k=q.toLowerCase();L.innerHTML=orders.filter(function(o){return(filter==="All"||o.status===filter)&&(o.id+o.name+o.phone).toLowerCase().indexOf(k)>-1}).map(oc).join("")||'<p class="mu">No orders here.</p>'}
 if(tab==="prods"){$("cl").innerHTML=cats.map(function(c){return '<span class="chip2">'+esc(c.emoji||"")+' '+esc(c.name)+'<button data-act="delcat" data-id="'+c.id+'" aria-label="Delete">×</button></span>'}).join("")||'<p class="mu">No categories yet.</p>';
  var k=q.toLowerCase();L.innerHTML=items.filter(function(i){return i.name.toLowerCase().indexOf(k)>-1}).map(function(i){return '<div class="card it">'+thumb(i)+'<div style="flex:1;min-width:0"><b>'+esc(i.name)+'</b> <span class="mu">'+esc(i.category)+'</span><div class="rw" style="justify-content:flex-start">₹<input type="number" style="width:84px" value="'+esc(i.price)+'" data-price="'+i.id+'" aria-label="Price"> <span class="mu">/ '+esc(i.unit)+'</span></div>'+
  '<div class="acts"><button class="b2" data-act="stock" data-id="'+i.id+'" data-v="'+(i.inStock===false)+'">'+(i.inStock===false?'Hidden · show':'In stock · hide')+'</button><button class="b2" data-act="edprod" data-id="'+i.id+'">Edit</button><button class="b2 dn" style="color:#fff" data-act="delprod" data-id="'+i.id+'">Delete</button></div></div></div>'}).join("")||'<p class="mu">No products yet.</p><button class="b" data-act="seed">Add sample products</button>'}
 if(tab==="posters")L.innerHTML=banners.map(function(b){return '<div class="card"><div class="pv" style="background:'+esc(bpv(b))+';background-size:cover;background-position:center"><div><b style="font-size:20px">'+esc(b.emoji||"")+' '+esc(b.title)+'</b><br>'+esc(b.subtitle||"")+'</div></div><div class="acts"><button class="b2" data-act="bact" data-id="'+b.id+'" data-v="'+(b.active===false)+'">'+(b.active===false?'Hidden · show':'Showing · hide')+'</button><button class="b2" data-act="edpost" data-id="'+b.id+'">Edit</button><button class="b2 dn" style="color:#fff" data-act="delpost" data-id="'+b.id+'">Delete</button></div></div>'}).join("")||'<p class="mu">No posters yet. Tap "+ New poster" to make an offer banner for your home page.</p>';
 if(tab==="set"&&!$("sf")){var s=Object.assign({},DEFAULTS,S);L.innerHTML='<div class="card"><label><input type="checkbox" id="so" style="width:auto" '+(s.storeOpen===false?'':'checked')+'> Store is open for orders</label><label for="sc">Message when closed</label><input id="sc" value="'+esc(s.closedMsg||"")+'" placeholder="Closed today. Back tomorrow!"><label for="sa">Announcement bar (top of store)</label><input id="sa" value="'+esc(s.announce||"")+'" placeholder="Free delivery this weekend!"></div>'+
  '<div class="card"><b>Delivery rules</b><label for="sf">Free delivery above (₹, within 3 km)</label><input id="sf" type="number" value="'+esc(s.freeAbove)+'"><label for="sn">Fee within 3 km below that (₹)</label><input id="sn" type="number" value="'+esc(s.nearFee)+'"><label for="sr">Fee for 3 to 5 km (₹)</label><input id="sr" type="number" value="'+esc(s.farFee)+'"></div>'+
  '<div class="card"><label for="su">Your UPI ID for payments</label><input id="su" value="'+esc(s.upi||"")+'" placeholder="name@upi"><label>Store color theme</label><div id="sw">'+COL.map(function(c){return '<span class="sw'+((s.color||COL[0])===c?' on':'')+'" style="background:'+c+'" data-act="col" data-v="'+c+'"></span>'}).join("")+'</div></div><button class="b big" data-act="saveset">Save settings</button>'}}
function render(){$("main").innerHTML=head();lst()}
function bpv(b){return b.image?'linear-gradient(90deg,#0009,#0001),url('+b.image+')':(b.bg||GR[0])}
function prodForm(p){p=p||{};pimg=p.image||"";editId=p.id||null;show('<h3>'+(p.id?'Edit':'Add')+' product</h3><div class="th" id="pv" style="width:100px;height:100px">'+(pimg?'<img src="'+esc(pimg)+'" alt="">':esc(p.emoji||"🥬"))+'</div><label class="b2">📷 Take / choose photo<input type="file" id="pfile" accept="image/*" hidden></label> <button class="b2" data-act="rmimg">Remove photo</button>'+
 '<label for="pn">Name</label><input id="pn" value="'+esc(p.name||"")+'"><div class="g4"><div><label for="pp">Price (₹)</label><input id="pp" type="number" value="'+esc(p.price||"")+'"></div><div><label for="pu">Unit</label><select id="pu">'+UNITS.map(function(u){return '<option'+(u===p.unit?' selected':'')+'>'+u+'</option>'}).join("")+'</select></div></div>'+
 '<label for="pc">Category</label><input id="pc" list="cdl" value="'+esc(p.category||"")+'" placeholder="Vegetables"><datalist id="cdl">'+cats.map(function(c){return '<option value="'+esc(c.name)+'">'}).join("")+'</datalist><label for="pe">Emoji (shown if no photo)</label><input id="pe" value="'+esc(p.emoji||"")+'" placeholder="🥬"><label><input type="checkbox" id="pk" style="width:auto" '+(p.inStock===false?'':'checked')+'> In stock</label><div class="msg" id="pm"></div><div class="acts"><button class="b2" data-act="close">Cancel</button><button class="b" data-act="saveprod">Save</button></div>')}
function postForm(b){b=b||{};bedit=b.id||null;bimg=b.image||"";bbg=b.bg||GR[0];show('<h3>'+(b.id?'Edit':'New')+' poster</h3><div class="pv" id="bpv"></div><b>Quick templates</b><div class="chips">'+TPL.map(function(t,i){return '<button class="ch" data-act="tpl" data-v="'+i+'">'+t[0]+'</button>'}).join("")+'</div>'+
 '<label for="bt">Title</label><input id="bt" value="'+esc(b.title||"")+'"><label for="bs">Small text</label><input id="bs" value="'+esc(b.subtitle||"")+'"><div class="g4"><div><label for="bb">Button text</label><input id="bb" value="'+esc(b.button||"Shop Now")+'"></div><div><label for="be">Emoji</label><input id="be" value="'+esc(b.emoji||"")+'"></div></div>'+
 '<label>Background color</label><div>'+GR.map(function(g,i){return '<span class="sw" style="background:'+g+'" data-act="bg" data-v="'+i+'"></span>'}).join("")+'</div><label class="b2">🖼️ Use my own photo<input type="file" id="bfile" accept="image/*" hidden></label> <button class="b2" data-act="rmbimg">Remove photo</button><label><input type="checkbox" id="ba" style="width:auto" '+(b.active===false?'':'checked')+'> Show on home page</label><div class="msg" id="bm"></div><div class="acts"><button class="b2" data-act="close">Cancel</button><button class="b" data-act="savepost">Save</button></div>');bprev()}
function bprev(){var p=$("bpv");if(!p)return;p.style.background=bpv({image:bimg,bg:bbg});p.style.backgroundSize="cover";p.style.backgroundPosition="center";p.innerHTML='<div><b style="font-size:20px">'+esc($("bt").value)+' '+esc($("be").value)+'</b><br>'+esc($("bs").value)+'</div>'}
function find(a,id){return a.filter(function(x){return x.id===id})[0]}
document.addEventListener("click",function(e){var t=e.target.closest("[data-act]");if(!t||(t.id==="md"&&e.target!==t))return;var a=t.dataset.act,d=t.dataset,id=d.id,v=d.v;
 if(a==="close")close();
 if(a==="go"){tab=v;sel();}
 if(a==="flt"){filter=v;lst()}
 if(a==="st")db.doc("orders/"+id).update({status:v,updatedAt:firebase.firestore.FieldValue.serverTimestamp()}).then(function(){toast("Marked "+v)});
 if(a==="paid")db.doc("orders/"+id).update({paid:v==="true"});
 if(a==="seed"){var b=db.batch();[["Vegetables","🥬"],["Fruits","🍎"],["Others","🥥"]].forEach(function(c,i){b.set(db.collection("categories").doc(),{name:c[0],emoji:c[1],order:i})});SEED.forEach(function(s){b.set(db.collection("items").doc(),{name:s[0],emoji:s[1],price:s[2],unit:s[3],category:s[4],inStock:true})});b.commit().then(function(){toast("Sample products added")})}
 if(a==="addcat"){var n=$("cn").value.trim();if(!n)return;db.collection("categories").add({name:n,emoji:$("ce").value.trim()||"🥬",order:Date.now()}).then(function(){$("cn").value="";$("ce").value=""})}
 if(a==="delcat"&&confirm("Delete this category? Products stay but lose the tile."))db.doc("categories/"+id).delete();
 if(a==="newprod")prodForm();if(a==="edprod")prodForm(find(items,id));
 if(a==="stock")db.doc("items/"+id).update({inStock:v==="true"});
 if(a==="delprod"&&confirm("Delete this product?"))db.doc("items/"+id).delete();
 if(a==="rmimg"){pimg="";$("pv").innerHTML=esc($("pe").value||"🥬")}
 if(a==="saveprod"){var n=$("pn").value.trim(),p=Number($("pp").value),c=$("pc").value.trim()||"Others";if(!n||!(p>=0)||$("pp").value===""){$("pm").textContent="Enter a name and price.";return}
  var dd={name:n,price:p,unit:$("pu").value,category:c,emoji:$("pe").value.trim(),image:pimg,inStock:$("pk").checked};
  (editId?db.doc("items/"+editId).update(dd):db.collection("items").add(dd)).then(function(){if(!cats.some(function(x){return x.name===c}))db.collection("categories").add({name:c,emoji:dd.emoji||"🥬",order:Date.now()});close();toast("Product saved")}).catch(function(){$("pm").textContent="Could not save. Try a smaller photo."})}
 if(a==="newpost")postForm();if(a==="edpost")postForm(find(banners,id));
 if(a==="tpl"){var x=TPL[v];$("bt").value=x[1];$("bs").value=x[2];$("be").value=x[3];bbg=GR[x[4]];bimg="";bprev()}
 if(a==="bg"){bbg=GR[v];bimg="";bprev()}if(a==="rmbimg"){bimg="";bprev()}
 if(a==="bact")db.doc("banners/"+id).update({active:v==="true"});
 if(a==="delpost"&&confirm("Delete this poster?"))db.doc("banners/"+id).delete();
