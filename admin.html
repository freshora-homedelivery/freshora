<script>

(function(){

 '<div class="card"><b>2. Address (URL) of your API</b><div style="word-break:break-all;margin:8px 0;font-weight:700">'+X(url())+'</div><button class="b2" id="apiu" type="button">Copy address</button></div>'+
 '<div class="card"><b>3. Put these in the AI assistant\'s "order lookup" tool</b><div class="mu" style="margin:8px 0;line-height:1.7">Method: <b>GET</b><br>URL: the address above<br>Header name: <b>x-api-key</b> &nbsp; Header value: <b>your key</b><br>Query parameter: <b>phone</b> (the caller\'s 10-digit number)</div></div>'+
 '<div class="card"><b>4. Test it</b><div style="display:flex;gap:8px;margin:8px 0"><input id="apit" inputmode="numeric" placeholder="Customer phone (10 digits)" style="flex:1;margin:0"><button class="b" id="apitb" type="button">Test</button></div><pre id="apir" style="white-space:pre-wrap;word-break:break-word;background:#f3f3f7;border-radius:10px;padding:10px;margin:0;font-size:12.5px;max-height:260px;overflow:auto">Result will show here.</pre></div></div>'};

window.apiBind=function(){
 adb.doc("private/agent").get().then(function(d){KEY=(d.exists&&d.data().key)||"";paint()}).catch(function(){g("apik").textContent="Could not read the key. Publish the new Firestore rules (see setup message), then reopen this tab."});
